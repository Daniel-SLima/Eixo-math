name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
      - run: pnpm run check
